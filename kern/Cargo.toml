[package]
name = "tagebuch-kern"
version = "0.1.0"
edition = "2021"
description = "Kern des Azeroth-Tagebuchs: liest SavedVariables und Kampflog, führt Daten zusammen"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
