[package]
name = "wowbilder"
version = "0.1.0"
edition = "2021"
description = "Liest Kartenbilder und Symbole aus der lokalen WoW-Installation (CASC). Liefert selbst keine Blizzard-Grafik mit."
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libz-sys = { version = "1", features = ["static"] }

[build-dependencies]
cc = "1"
