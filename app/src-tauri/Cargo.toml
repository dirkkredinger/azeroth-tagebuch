[package]
name = "azeroth-tagebuch"
version = "0.3.0"
description = "Azeroth-Tagebuch: Tagebuch und Statistiken für World of Warcraft"
authors = ["dirkkredinger"]
license = "GPL-3.0-or-later"
repository = "https://github.com/dirkkredinger/azeroth-tagebuch"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "azeroth_tagebuch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tagebuch-kern = { path = "../../kern" }
wowbilder = { path = "../../wowbilder" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Bilddekodierung und CascLib auch im Entwicklungsmodus schnell
[profile.dev.package."*"]
opt-level = 2
